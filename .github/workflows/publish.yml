name: Publish

on:
  release:
    types: [published]
  # Retries a publish that failed after the release was cut.
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing: npm checks the workflow's OIDC token, so there's no NPM_TOKEN.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Base Repo
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.25.0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # prepublishOnly builds the package around the committed binaries
    - name: Publish
      run: pnpm publish --no-git-checks
